[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esf-figure2-reproduction"
version = "0.1.0"
description = "Independent numerical reproduction of Li et al. (2021) JGR Figure 2"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "h5py>=3.10",
  "Pillow>=10",
  "pyamg>=5.0",
  "pypardiso>=0.4.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

